syntax = "proto3";

package arb.config;

option go_package = "arb/proto/config";

import "google/protobuf/duration.proto";

// ============================================================
// ARB 系统配置 schema（detector/evaluator 架构版）
//
// 依据：
//   - docs/design/03-strategies.md（三类 Detector）
//   - docs/design/08-roadmap.md（FX 先行 / Detector 落地顺序）
//   - docs/design/07-risk-audit.md §1 + discussion-log 讨论五（P1 风控参数）
//
// ★ 取代旧 schema：
//   - 旧 `StrategyConfig` + `StrategyType`（TRIANGULAR/CROSS_EXCHANGE/STATISTICAL/FUTURES_SPOT）
//     → 由 `DetectorConfig` + `DetectorType`（CROSS_EXCHANGE/CARRY/TRIANGULAR）替代。
//   - 旧 `StatisticalParams`（统计套利）删除——00 §4 明确排除统计套利（概率性，非"准确无误"）。
//   - 旧 `RiskConfig` 的 max_consecutive_losses / max_window_loss / max_drawdown_pct /
//     max_concurrent_orders / rate_limit_initial → 由 P1 参数集替代（07 §1）；
//     CircuitBreaker / AdaptiveRateLimiter 的内部行为参数保留在组件内部，非配置驱动。
//
// 旧配置文件（config/default.textproto）需同步迁移：strategies {…} → detectors {…}。
// ============================================================


// BrokerConfig 定义单个 MT4/MT5 经纪商连接参数。（保留，字段不变）
message BrokerConfig {
  // 经纪商标识名（如 "ICMarketsSC-Demo"），用于 Quote.Broker 字段和日志。
  string name = 1;

  // 平台类型：MT4 或 MT5。
  PlatformType platform = 2;

  // gRPC 连接参数。
  string host = 3;       // IP 或 DNS
  int32 port = 4;        // 通常 443

  // 登录凭证。
  int64 user = 5;        // MT5: uint64 转 int64；MT4: int32 转 int64
  string password = 6;

  // 可选：使用 ConnectEx（按服务器名而非 host:port）。
  string server = 7;     // 如 "ICMarketsSC-Demo"，非空时使用 ConnectEx

  // 可选：代理。
  ProxyConfig proxy = 8;

  // 可选：连接超时。默认 30 秒。
  google.protobuf.Duration connect_timeout = 9;
}

enum PlatformType {
  PLATFORM_TYPE_UNSPECIFIED = 0;
  PLATFORM_TYPE_MT4 = 1;
  PLATFORM_TYPE_MT5 = 2;
}

message ProxyConfig {
  string host = 1;
  int32 port = 2;
  string user = 3;
  string password = 4;
  ProxyType type = 5;
}

enum ProxyType {
  PROXY_TYPE_UNSPECIFIED = 0;
  PROXY_TYPE_HTTPS = 1;
  PROXY_TYPE_SOCKS4 = 2;
  PROXY_TYPE_SOCKS5 = 3;
}


// ============================================================
// DetectorConfig（★新，替代旧 StrategyConfig）
//
// Detector 只「发现候选机会」（仅毛价差），不算净盈利——那是 Evaluator 的职责（03 §1）。
// 依据 03-strategies §2（三类）+ 08-roadmap（FX 先行落地顺序）。
// ============================================================
message DetectorConfig {
  // Detector 类型。决定 Scan 逻辑（03 §2）。
  DetectorType type = 1;

  // 是否启用。关闭的 detector 不参与扫描（desk 管理 Tab 可切换，04 §4 策略开关）。
  bool enabled = 2;

  // 订阅的逻辑（canonical）品种。空 = 该类型 detector 扫描所有已映射品种。
  // 跨所 / 套息按 canonical 聚合（09 §2 QuoteBus canonical 路由）。
  repeated string canonical_symbols = 3;

  // 单腿下单超时（pipeline 用，ConfirmOpportunity 触发后生效）。
  google.protobuf.Duration order_timeout = 4;
}

// DetectorType 替代旧 StrategyType。
// 删除：STATISTICAL（00 §4 排除）、FUTURES_SPOT（期现，本期 FX 不做，Crypto 阶段再补）。
enum DetectorType {
  DETECTOR_TYPE_UNSPECIFIED = 0;
  DETECTOR_TYPE_CROSS_EXCHANGE = 1;   // 跨所价差（03 §2.1，★最稳，第一优先）
  DETECTOR_TYPE_CARRY           = 2;  // 对冲套息（03 §2.2）
  DETECTOR_TYPE_TRIANGULAR      = 3;  // 三角（03 §2.3，执行最难，最后）
}


// ============================================================
// RiskConfig（★重写，P1 参数集）
//
// 依据 07-risk-audit §1（P1 初值，自适应）+ discussion-log 讨论五。
// 套利风控不是防"单笔亏"，是防：执行失败→单边敞口 / 对手方爆雷 / 数据断流→假信号。
// 所有参数是初值，由归因（07 §4）持续校准——不写死。
// ============================================================
message RiskConfig {
  // —— 资金门禁（CapitalGate，07 §1）——

  // P1：单机会最大敞口（占 total equity 的百分比）。防单机会执行失败敞口。初值 5.0。
  double max_exposure_per_opportunity_pct = 1;

  // P1：最大并发未平仓机会数。防风险叠加 + 管道压力。初值 5。
  int32 max_concurrent_opportunities = 2;

  // P1：单平台（broker）资金占比上限（占 total equity 的百分比）。防对手方风险。初值 40.0。
  double single_broker_exposure_pct = 3;

  // 单笔名义本金上限（USD）。防配置错误（如手数多打一个 0）。
  double max_notional_per_trade = 4;

  // —— 执行兜底（pipeline，04 §3）——

  // P1：单边敞口存活上限 → 自动对冲/平仓（一腿失败变赌注，04 §3）。初值 3s。
  google.protobuf.Duration max_leg_exposure_duration = 5;

  // revalidate 价偏阈值（bps）。ConfirmOpportunity 触发后重拉报价，价偏超此值 → 放弃（Expired）。
  // 初值 = 机会阈值（net_bps ≥ 3bp）的同一量级；归因校准（07 §4）。
  double revalidate_max_slippage_bps = 6;

  // —— 熔断（CircuitBreaker，07 §2）——

  // P1：日亏损熔断（占日初 total equity 的百分比）。日亏超此值 → 暂停新机会，须人工 Resume。初值 3.0。
  double daily_loss_limit_pct = 7;
}


// DatabaseConfig 定义 PostgreSQL 连接。（保留，字段不变）
message DatabaseConfig {
  string dsn = 1;  // "postgres://user:pass@host:port/db"
}

// DashboardConfig 定义 DashboardService gRPC server。（保留，字段不变）
message DashboardConfig {
  string listen_address = 1;   // 默认 "127.0.0.1:50051"
  int32 matrix_refresh_ms = 2; // 价差矩阵刷新间隔，默认 100ms
}


// ============================================================
// SystemConfig：完整系统配置（顶层）
//
// ★变化：`repeated StrategyConfig strategies = 2`
//        → `repeated DetectorConfig detectors = 2`（替代旧 strategies）。
// 其余顶层字段（brokers / risk / database / dashboard）保留。
// ============================================================
message SystemConfig {
  repeated BrokerConfig brokers = 1;
  repeated DetectorConfig detectors = 2;   // ★替代旧 strategies
  RiskConfig risk = 3;
  DatabaseConfig database = 4;
  DashboardConfig dashboard = 5;
}
