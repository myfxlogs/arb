services:
  postgres:
    image: postgres:16-alpine
    container_name: arb-postgres
    environment:
      POSTGRES_USER: arb
      POSTGRES_PASSWORD: arb
      POSTGRES_DB: arb
    volumes:
      - arb-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arb"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build: .
    container_name: arb-core
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DSN: "postgres://arb:arb@postgres:5432/arb?sslmode=disable"
    ports:
      - "127.0.0.1:50051:50051"
    restart: unless-stopped

volumes:
  arb-pgdata:
